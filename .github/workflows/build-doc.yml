name: build-doc

on: [workflow_dispatch]

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - name: Install packages required
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-sphinx

      - name: Script kernel-doc
        run: |
          make htmldocs